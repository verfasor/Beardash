<!doctype html>
<!--
  Beardash script-enabled preview.

  Loaded in an <iframe sandbox="allow-scripts …"> WITHOUT allow-same-origin, so the browser gives it an
  opaque origin: scripts here can't read Beardash's page, memory, storage or API keys, can't navigate
  the app, and can't show alert/prompt dialogs. Beardash sends the post HTML in with postMessage. Each
  render loads a fresh copy of this page, so scripts and timers from the previous render don't pile up.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Preview</title>
  </head>
  <body>
    <script>
      ;(function () {
        var parentWin = window.parent
        if (!parentWin || parentWin === window) return

        var CSS =
          ':root{--bg:#f8f8f7;--text:#191918;--text-2:#5c5c58;--border:#e9e9e7;--code:#f1f1f0;--accent:#2f5bd3;color-scheme:light}' +
          ':root[data-theme=dark]{--bg:#1c1c1c;--text:#ececea;--text-2:#a5a5a0;--border:#2a2a2a;--code:#252525;--accent:#85a5f5;color-scheme:dark}' +
          'html,body{margin:0;background:var(--bg);color:var(--text)}' +
          'html{scrollbar-width:thin;scrollbar-color:var(--border) transparent}' +
          '.prose{max-width:66ch;margin:0 auto;padding:40px 32px 30vh;font:18px/1.7 Charter,"Bitstream Charter","Iowan Old Style",Georgia,Cambria,serif;overflow-wrap:break-word}' +
          '.prose .preview-title{font:650 30px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;letter-spacing:-.02em;margin:0 0 24px}' +
          '.prose h1,.prose h2,.prose h3,.prose h4{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-weight:650;line-height:1.3;margin:1.8em 0 .5em}' +
          '.prose h1{font-size:1.5em}.prose h2{font-size:1.3em}.prose h3{font-size:1.1em}' +
          '.prose p,.prose ul,.prose ol,.prose blockquote,.prose pre,.prose table,.prose figure{margin:0 0 1.15em}' +
          '.prose a{color:var(--accent)}.prose img,.prose video,.prose iframe{max-width:100%;height:auto;border:0}' +
          '.prose blockquote{margin-left:0;padding-left:1em;border-left:2px solid var(--border);color:var(--text-2)}' +
          '.prose code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.82em;padding:.15em .35em;border-radius:4px;background:var(--code)}' +
          '.prose pre{padding:14px 16px;border-radius:8px;background:var(--code);overflow:auto;font-size:14px;line-height:1.55}.prose pre code{background:none;padding:0}' +
          '.prose hr{border:0;border-top:1px solid var(--border);margin:2.2em 0}' +
          '.prose table{border-collapse:collapse;font-size:.9em;display:block;overflow-x:auto}.prose th,.prose td{border:1px solid var(--border);padding:6px 10px;text-align:left}' +
          '@media (max-width:760px){.prose{padding:24px 16px 30vh;font-size:17px}}'

        // Runs inside the written document: scroll sync with the editor, links open in a new tab.
        var CHILD =
          '(function(){var p=window.parent;' +
          'function max(){var s=document.scrollingElement||document.documentElement;return Math.max(0,s.scrollHeight-innerHeight)}' +
          'function go(r){if(typeof r==="number"&&isFinite(r)){(document.scrollingElement||document.documentElement).scrollTop=Math.max(0,Math.min(1,r))*max()}}' +
          'addEventListener("message",function(e){if(e.source!==p)return;var d=e.data;if(d&&d.type==="beardash:scroll")go(d.ratio)});' +
          'document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(a&&!a.target&&a.getAttribute("href").charAt(0)!=="#"){a.target="_blank";a.rel="noopener noreferrer"}},true);' +
          'var r0=window.__beardashScroll;if(r0){go(r0);addEventListener("load",function(){go(r0)})}' +
          '})();'

        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
          })
        }

        addEventListener('message', function onMessage(e) {
          if (e.source !== parentWin) return
          var d = e.data
          if (!d || d.type !== 'beardash:render' || typeof d.html !== 'string') return
          removeEventListener('message', onMessage)
          var theme = d.theme === 'dark' ? 'dark' : 'light'
          var ratio = typeof d.scrollRatio === 'number' && isFinite(d.scrollRatio) ? d.scrollRatio : 0
          var title = typeof d.title === 'string' && d.title ? '<h1 class="preview-title">' + esc(d.title) + '</h1>' : ''
          // document.write (not innerHTML) so the post's <script> tags run, in order, like on Bear.
          document.open()
          document.write(
            '<!doctype html><html data-theme="' + theme + '"><head><meta charset="utf-8">' +
              '<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">' +
              '<style>' + CSS + '</style><script>window.__beardashScroll=' + ratio + '<\/script></head>' +
              '<body><article class="prose">' + title + d.html + '</article>' +
              '<script>' + CHILD + '<\/script></body></html>',
          )
          document.close()
        })

        parentWin.postMessage({ type: 'beardash:ready' }, '*')
      })()
    </script>
  </body>
</html>
